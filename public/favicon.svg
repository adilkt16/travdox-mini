<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Paper base gradient -->
    <radialGradient id="paperGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBF7ED" />
      <stop offset="80%" stop-color="#F1E8D2" />
      <stop offset="100%" stop-color="#E4D7B8" />
    </radialGradient>

    <!-- Gold foil metallic gradient -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A57F2C" />
      <stop offset="35%" stop-color="#F2DC8A" />
      <stop offset="50%" stop-color="#FFF9E6" />
      <stop offset="70%" stop-color="#F2DC8A" />
      <stop offset="100%" stop-color="#C9A24B" />
    </linearGradient>

    <!-- Rough ink stamp filter -->
    <filter id="stampInk" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" result="displaced" />
    </filter>

    <!-- Curved arc text paths -->
    <path id="topArc" d="M 80 256 A 176 176 0 0 1 432 256" fill="none" />
    <path id="bottomArc" d="M 432 256 A 176 176 0 0 1 80 256" fill="none" />
  </defs>

  <!-- Background rounded canvas (paper tone) -->
  <rect width="512" height="512" rx="100" fill="url(#paperGrad)" />

  <!-- Stamp Group with rough ink displacement -->
  <g filter="url(#stampInk)" transform="rotate(-6 256 256)">
    <!-- Outer scalloped / dashed circle -->
    <circle cx="256" cy="256" r="224" fill="none" stroke="#2A4B9B" stroke-width="5" stroke-dasharray="14 7" opacity="0.85" />
    <circle cx="256" cy="256" r="208" fill="none" stroke="#1C2B4B" stroke-width="3" />
    <circle cx="256" cy="256" r="144" fill="none" stroke="#1C2B4B" stroke-width="2.5" />
    <circle cx="256" cy="256" r="136" fill="none" stroke="#2A4B9B" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Circular curved stamp typography -->
    <text fill="#1C2B4B" font-family="'Big Shoulders Display', 'Arial Black', sans-serif" font-size="34" font-weight="900" letter-spacing="6">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">
        ★ LAYOVER PASSPORT ★
      </textPath>
    </text>

    <text fill="#2A4B9B" font-family="'Special Elite', 'Courier New', monospace" font-size="20" font-weight="700" letter-spacing="4">
      <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
        IMMIGRATION · 2026 · ENTRY
      </textPath>
    </text>

    <!-- Center Compass Star & Shield Emblem -->
    <!-- Gold shield backfill -->
    <path d="M 256 166 C 290 166 312 180 320 206 C 324 246 310 292 256 332 C 202 292 188 246 192 206 C 200 180 222 166 256 166 Z"
          fill="#B23A2B" fill-opacity="0.12" stroke="#B23A2B" stroke-width="2.5" stroke-dasharray="6 3" />

    <!-- 8-Point Compass Star -->
    <g fill="url(#goldFoil)" stroke="#A57F2C" stroke-width="1.5">
      <polygon points="256,182 264,236 304,216 268,248 318,256 268,264 304,296 264,276 256,330 248,276 208,296 244,264 194,256 244,248 208,216 248,236" />
    </g>

    <!-- Center entry banner text -->
    <rect x="180" y="244" width="152" height="24" fill="#F1E8D2" stroke="#1C2B4B" stroke-width="2" />
    <text x="256" y="261" text-anchor="middle" fill="#1C2B4B" font-family="'Big Shoulders Display', sans-serif" font-size="18" font-weight="900" letter-spacing="3">
      ADMITTED
    </text>

    <!-- Side Stars -->
    <circle cx="106" cy="256" r="6" fill="#B23A2B" />
    <circle cx="406" cy="256" r="6" fill="#B23A2B" />
  </g>
</svg>
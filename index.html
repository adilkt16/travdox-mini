<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#5A1F26" />
    <title>Layover Passport</title>
    <!-- Google Fonts with preconnect & display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=IM+Fell+English:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#E4D7B8] text-ink antialiased selection:bg-paper-shadow selection:text-ink">
    <!-- Global paper-grain inline SVG feTurbulence filter on body -->
    <div id="paper-grain-overlay" class="pointer-events-none fixed inset-0 z-50 mix-blend-multiply opacity-35" aria-hidden="true">
      <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <filter id="grain-canvas">
          <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="3" stitchTiles="stitch" />
          <feColorMatrix type="matrix" values="0 0 0 0 0.11   0 0 0 0 0.17   0 0 0 0 0.29   0 0 0 0.10 0" />
        </filter>
        <rect width="100%" height="100%" filter="url(#grain-canvas)" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
